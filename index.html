<script>
const $=s=>document.querySelector(s),S=localStorage,URL_='https://api.groq.com/openai/v1/chat/completions';

const ESTUDIO=' MODO ESTUDIO ACTIVO: Eddy está estudiando. Ignora el límite de 3 frases: puedes extenderte hasta 8 frases. Explica paso a paso con claridad y un ejemplo sencillo, sin dar solo la respuesta final. Termina con una pregunta de práctica corta para que Eddy responda. Cuando Eddy responda a tu pregunta, dile si es correcto y explica el error si lo hay.';

const fd=t=>new Date(t).toLocaleString('es',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});

function tick(){const n=Date.now(),v=mem.recs.filter(r=>r.due<=n);if(!v.length)return;mem.recs=mem.recs.filter(r=>r.due>n);v.forEach(r=>{if(r.rep){let d=r.due;while(d<=n)d+=r.rep==='d'?864e5:6048e5;mem.recs.push({...r,due:d})}});save();

 const n=norm(o).trim(),w=n.split(/\s+/).length;let m;
 if(/^(recuerdame|avisame|recordatorio)/.test(n)){let due=null,mm;const rep=/todos los dias|cada dia|diario/.test(n)?'d':/todas las semanas|cada semana|semanal/.test(n)?'w':null,nn=n.replace(/de la manana/g,'');

   else if(/\bmanana\b/.test(nn))d.setDate(d.getDate()+1);else if(d<=Date.now())d.setDate(d.getDate()+1);due=d.getTime()}

 if(/^(recuerdame|avisame|recordatorio|temporizador|pon un temporizador|programa)/.test(n)&&(m=n.match(/\b(\d+|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince|veinte|treinta)\s*(segundo|minuto|hora)s?/))){

async function ia(texto,plano){
 if(!cfg.key){say('Falta la clave de Groq. Escríbela en Ajustes.');$('#dlg').showModal();return}
 if(!navigator.onLine){mem.cola.push(texto);save();say('Sin conexión, Eddy. Guardé tu mensaje y lo enviaré cuando vuelva la señal.');return}
 mem.historial.push({role:'user',content:texto,t:Date.now()});
 const ms=[{role:'system',content:plano?SIS:sis()},...mem.historial.slice(-20).map(({role,content})=>({role,content}))];
 const el=add('b live','');
 for(let i=0;i<3;i++){
  try{
   const r=await fetch(URL_,{method:'POST',headers:{Authorization:'Bearer '+cfg.key,'Content-Type':'application/json'},body:JSON.stringify({model:cfg.model,messages:ms,stream:true})});
   if(r.status===503){await sleep(3000);continue}
   const bad=r.status===401?'La clave de Groq no es válida. Corrígela en Ajustes.':r.status===429?'Se alcanzó el límite de uso de Groq. Espera un momento e intenta de nuevo.':!r.ok?'Groq respondió con el error '+r.status+'.':'';
   if(bad){mem.historial.pop();fail(el,bad);return}
   const rd=r.body.getReader(),dc=new TextDecoder();let buf='',out='';
   for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data: '))continue;const d=l.slice(6).trim();if(d==='[DONE]')continue;try{out+=JSON.parse(d).choices[0].delta.content||'';el.textContent=out;down()}catch(e){}}}
   el.classList.remove('live');out=out.trim()||'Sin respuesta, Eddy. Intenta de nuevo.';el.textContent=out;
   mem.historial.push({role:'assistant',content:out,t:Date.now()});mem.historial=mem.historial.slice(-60);save();hablar(out);return out
  }catch(e){await sleep(1500)}
 }
 mem.historial.pop();mem.cola.push(texto);save();fail(el,'No pude conectar con Groq. Guardé tu mensaje y lo reintento cuando vuelva la señal.')}

$('#mab').onclick=()=>{const t=mEl.textContent,i=mem.historial.map(h=>h.content).lastIndexOf(t);if(i>=0)mem.historial.splice(i,1);mEl.remove();save();$('#ma').close()};
$('#max').onclick=()=>$('#ma').close();
function pNot(){const b=$('#s-notas .bd');b.innerHTML='';if(!mem.datos.length){vacio(b,'Aún no tienes notas','n1','Escribir primera nota');$('#n1').onclick=nuevaNota;return}
 mem.datos.map((e,i)=>[e,i]).reverse().forEach(([e,i])=>fila(b,e.texto,e.t?fd(e.t):'',()=>confirmar('¿Seguro que quieres eliminar esta nota?',()=>{mem.datos.splice(i,1);save();pNot()})))}
function nuevaNota(){pedirTexto('Nueva nota',x=>{mem.datos.push({texto:x,t:Date.now()});save();pNot()})}
$('#nadd').onclick=nuevaNota;
const mon=g=>{const d=new Date(g.t),n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()};
function resG(){const M=mem.gastos.filter(mon),C={};M.forEach(g=>C[g.c]=(C[g.c]||0)+g.m);return{M,C,T:M.reduce((a,g)=>a+g.m,0)}}
function addGasto(x){const m=x.match(/(\d+(?:[.,]\d+)?)/);if(!m)return null;const v=+m[1].replace(',','.'),c=x.replace(m[0],'').replace(/\b(pesos|en|de|mxn)\b|\$/gi,'').trim()||'otros';mem.gastos.push({t:Date.now(),m:v,c});save();return{m:v,c}}
function pGas(){const b=$('#s-gastos .bd'),r=resG();b.innerHTML='<div class="cd"><small>Total del mes</small><b style="font-size:26px;color:var(--cy)">$'+r.T+'</b>'+Object.entries(r.C).map(([k,v])=>'<small>'+esc(k)+': $'+v+'</small>').join('')+'</div><div id="gl"></div>';
 if(!mem.gastos.length){$('#gl').innerHTML='<div class="vac"><p>Aún no tienes gastos</p></div>';return}
 mem.gastos.map((g,i)=>[g,i]).reverse().slice(0,40).forEach(([g,i])=>fila($('#gl'),'$'+g.m+' · '+g.c,fd(g.t),()=>confirmar('¿Seguro que quieres eliminar este gasto?',()=>{mem.gastos.splice(i,1);save();pGas()})))}
$('#gadd').onclick=()=>pedirTexto('Nuevo gasto (ejemplo: 50 comida)',x=>{addGasto(x);pGas()});
const prox=f=>{const n=new Date(),h=new Date(n.getFullYear(),n.getMonth(),n.getDate());let d=new Date(n.getFullYear(),f.m-1,f.d);if(d<h)d=new Date(n.getFullYear()+1,f.m-1,f.d);return Math.round((d-h)/864e5)};
function addFecha(n,d,m){if(!n||d<1||d>31||m<1||m>12)return false;mem.fechas.push({n,d,m});save();return true}
function pFec(){const b=$('#s-fechas .bd');b.innerHTML='';if(!mem.fechas.length){vacio(b,'Aún no tienes fechas importantes','f1','Agregar primera fecha');$('#f1').onclick=nuevaFec;return}
 mem.fechas.map((f,i)=>[f,i,prox(f)]).sort((a,c)=>a[2]-c[2]).forEach(([f,i,p])=>fila(b,f.n,f.d+'/'+f.m+' · '+(p===0?'hoy':p===1?'mañana':'en '+p+' días'),()=>confirmar('¿Seguro que quieres eliminar esta fecha?\n'+f.n,()=>{mem.fechas.splice(i,1);save();pFec()})))}
function nuevaFec(){pedirTexto('Nueva fecha (ejemplo: Cumpleaños de mamá 15/03)',x=>{const q=x.match(/^(.+?)\s+(\d{1,2})[\/\-](\d{1,2})$/);if(!q||!addFecha(q[1].trim(),+q[2],+q[3]))say('Usa el formato: nombre día/mes, por ejemplo: Mamá 15/03');pFec()})}
$('#fadd').onclick=nuevaFec;
function avisoFechas(){const h=dia(new Date());if(cfg.fa===h)return;const L=mem.fechas.map(f=>[f,prox(f)]).filter(x=>x[1]<2);if(!L.length)return;cfg.fa=h;save();L.forEach(([f,p])=>{const t=(p?'Mañana es: ':'Hoy es: ')+f.n+'.';say(t);notify(t)})}
setTimeout(avisoFechas,3000);
let cr=0,crT=null,pm=null;
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function pTie(){const b=$('#s-tiempo .bd');b.innerHTML='<div class="cd"><small>Cronómetro</small><b id="cv" style="font-size:32px;color:var(--cy)"></b><div class="row"><button id="c1b"></button><button id="c2b">Reiniciar</button></div></div><div class="cd"><small>Pomodoro: 25 min de enfoque y 5 de descanso</small><b id="pv" style="font-size:32px;color:var(--cy)"></b><div class="row"><button id="p1b"></button><button id="p2b">Detener</button></div></div>';
 $('#c1b').onclick=()=>{if(crT){cr+=Date.now()-crT;crT=null}else crT=Date.now();pTic()};$('#c2b').onclick=()=>{cr=0;crT=crT?Date.now():null;pTic()};
 $('#p1b').onclick=()=>{if(!pm){pm={f:'Enfoque',fin:Date.now()+15e5};pTic()}};$('#p2b').onclick=()=>{pm=null;pTic()};pTic()}
function pTic(){if(!$('#cv'))return;$('#cv').textContent=mmss(cr+(crT?Date.now()-crT:0));$('#c1b').textContent=crT?'Pausar':cr?'Continuar':'Iniciar';$('#pv').textContent=pm?pm.f+' '+mmss(pm.fin-Date.now()):'Listo';$('#p1b').textContent=pm?'En curso':'Iniciar'}
function pomo(){if(pm&&Date.now()>=pm.fin){const f=pm.f==='Enfoque';pm={f:f?'Descanso':'Enfoque',fin:Date.now()+(f?3e5:15e5)};const t=f?'Hora de descansar 5 minutos.':'A enfocarse otros 25 minutos.';say(t);notify(t);navigator.vibrate&&navigator.vibrate([300,150,300]);beep()}}
setInterval(()=>{pomo();if(scr==='tiempo')pTic()},500);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
tick();
</script></body></html>
